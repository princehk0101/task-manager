{% extends "base.html" %}
{% block title %} Contact Us {% endblock %}

{% block content %}
<div class="container mt-5">
  <h1>Contact Us</h1>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send</button>
  </form>

  {% for message in messages %}
    <div class="alert alert-success mt-3">{{ message }}</div>
  {% endfor %}
</div>
{% endblock %}
