{% extends "base.html" %}
{% block title %}Logout{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
  <h2>Are you sure you want to logout?</h2>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger mt-3">Logout</button>
  </form>
</div>
{% endblock %}
