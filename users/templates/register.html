{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %} Register{% endblock %}
{% block content %}
    <div class="container">
        <h2> Register Forms  </h2>
        <hr>
        <form method="POST" class="col-6">
            {% csrf_token %}
            {{ register_form | crispy}}
            <button type="submit" class="btn btn-primary">submit</button>
        </form>
    </div>
{% endblock %}
